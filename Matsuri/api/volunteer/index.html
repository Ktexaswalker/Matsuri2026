  <hr class="nuvesRojas my-0 py-0 bg-dblue">
  <section id="carrousel-voluntarios"></section>
  <hr class="escamasAzules bg-dblue my-0 py-0">
  <section id="info" class="mt-0 pt-0"></section>

  <hr class="olasRojas my-0 py-0 bg-dblue">



  <script>
    const target = document.getElementById("carrousel-voluntarios");
    const observer = new MutationObserver((mutationsList, observer) => {
      mutationsList.forEach(mutation => {
        if (!mutation.target.classList.contains("swiper-slide-active")) return;
        const volunters = document.getElementById("info");      
        const aria = mutation.target.getAttribute("aria-label");
        if (!aria) return;
        const actual = parseInt(aria.split("/")[0].trim());
        const indexReal = actual - 1;
        const index = Number(mutation.target.getAttribute("data-swiper-slide-index"));
        const id = Number(mutation.target.getAttribute("id"));
        Array.from(volunters.children).forEach((el, i) => {
            const slide = document.querySelector(`.swiper-slide[data-swiper-slide-index="${i}"]`);
            if (i === indexReal) {
              el.classList.remove("d-none");
              if (slide) slide.style.opacity = "1";
            } else {
              el.classList.add("d-none");
              if (slide) slide.style.opacity = "0.1";
            }
          });
        });
      });
      observer.observe(target, {
        childList: true,
        subtree: true,
        attributeFilter: ["class"]
    });
